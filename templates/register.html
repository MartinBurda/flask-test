{% extends "base.html" %}

{% block content %}

<h2>
    {% block title %}
    register
    {% endblock %}
</h2>
<form method="POST">
    <label>
        username
        <input type="text" name="username" required>
    </label>
        <label>
        email
        <input type="text" name="email">
    </label>
    <label>
        password
        <input type="password" name="password">
    </label>
        <label>
        password again
        <input type="password" name="password1">
    </label>
    <label>
        submit
        <input type="submit" name="submit">
    </label>
</form>
{% endblock %}
